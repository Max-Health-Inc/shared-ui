name: Checks

# One quality gate for pull requests and, via workflow_call, for publish.yml.
on:
  pull_request:
  workflow_call:

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  check:
    uses: max-network/.github/.github/workflows/check.yml@main
    with:
      runtime: bun
      install: bun install
      steps: "lint typecheck test build"
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
