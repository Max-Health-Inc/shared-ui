name: Checks

# One quality gate for pull requests and for publish.yml, which calls this via workflow_call.
on:
  pull_request:
  workflow_call:

jobs:
  check:
    uses: Max-Health-Inc/.github/.github/workflows/check.yml@main
    with:
      package-manager: bun
      lint: bun run lint
      typecheck: bun run typecheck
      test: bun test
      build: bun run build
    secrets: inherit
