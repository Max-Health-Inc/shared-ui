name: Checks

# The quality gate, defined ONCE and used twice:
#   - on every pull request, which previously had no checks at all (publish.yml only
#     triggers on push to main, so a PR could be merged entirely unverified)
#   - by publish.yml via `workflow_call`, so a release runs exactly the same suite
#     instead of a second copy of these steps that can drift from this one
#
# CI workflows are a known duplication hotspot across the org, so this is deliberately
# a reusable workflow rather than a file to copy.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  check:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # The committed .npmrc points @max-health-inc and @max-network at GH Packages and
        # reads the token from ${GITHUB_TOKEN}. The run's OWN token is enough here: the only
        # GH Packages dependency is @max-health-inc/config, which is a PUBLIC package in this
        # same org, and a public package is readable by any authenticated token.
        #
        # Deliberately NOT secrets.GH_PACKAGES_TOKEN. Nothing in this repo consumed a GH
        # Packages package until config moved off its git URL, so that secret had never been
        # exercised — and when it finally was, it came back 401, i.e. rejected outright rather
        # than merely unauthorized. The automatic token cannot expire, so it cannot rot the
        # same way. Matches dicom-viewer's publish-ig.yml, which authenticates to the same
        # registry with secrets.GITHUB_TOKEN.
        #
        # If this repo ever takes a PRIVATE dependency, or one from another org (@max-network
        # is a different org), this must go back to a PAT with read:packages for it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
