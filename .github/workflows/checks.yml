name: Checks

# The quality gate, defined ONCE and used twice:
#   - on every pull request, which previously had no checks at all (publish.yml only
#     triggers on push to main, so a PR could be merged entirely unverified)
#   - by publish.yml via `workflow_call`, so a release runs exactly the same suite
#     instead of a second copy of these steps that can drift from this one
#
# CI workflows are a known duplication hotspot across the org, so this is deliberately
# a reusable workflow rather than a file to copy.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  check:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # The committed .npmrc points @max-health-inc and @max-network at GH Packages and
        # reads its token from ${GITHUB_TOKEN}. The run's OWN token is used, NOT
        # secrets.GH_PACKAGES_TOKEN, because the PAT does not work here and we could not
        # establish why.
        #
        # What is established: with GH_PACKAGES_TOKEN this step fails
        #   401 GET https://npm.pkg.github.com/download/@max-health-inc/config/<v>/<sha>
        # and with the run's own token it succeeds. Ruled out by test, not by reasoning:
        # token expiry (it has none), a missing read:packages scope (present — and a local
        # token WITHOUT that scope downloads the package fine), package visibility (made
        # public; identical 401 after), SAML SSO authorization (the org has no SAML IdP),
        # and a stale secret value (re-set; identical 401 after). Other repos install the
        # same package with their own GH_PACKAGES_TOKEN, so the failure is specific to this
        # repo's credential, not to the package.
        #
        # This works only while every GH Packages dependency is PUBLIC and in THIS org, which
        # today means @max-health-inc/config alone. @max-network is a different org and a
        # run-scoped token cannot read it, so adding any @max-network dependency requires
        # solving the PAT problem first — do not just swap the token and expect it to work.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
