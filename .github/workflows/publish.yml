name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@max-health-inc'

      - name: Install dependencies
        # shared-ui now depends on @max-network/css (a different org's GH Packages
        # registry package); the committed .npmrc reads ${GITHUB_TOKEN}, so the
        # install step needs the org's cross-org read token to resolve it.
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          # The committed .npmrc resolves _authToken from ${GITHUB_TOKEN}; the publish
          # needs a write-capable token there too (else it expands empty → E401).
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
