name: Publish to GitHub Packages

# Publishes on merge to main; a version already on the registry is a no-op. Bump the
# version in your PR to release. checks.yml gates the publish, so PRs and releases run the
# same suite; `prepublishOnly` builds dist/.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  publish:
    needs: checks
    uses: max-network/.github/.github/workflows/publish-package.yml@main
    with:
      runtime: bun
      scope: '@max-health-inc'
      gate: false
      install: bun install && bun run build
      tag-release: true
      create-release: true
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
